name: Validate and deploy 7 Nebo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate production data
        run: node tests/validate-site-data.cjs --production

      - name: Run template regression
        run: node tests/check-template-regression.cjs

      - name: Build safe Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          core_files=(
            index.html
            desktop.css
            desktop.js
            mobile.css
            mobile-overrides.css
            mobile.js
            salon-palette.css
            site-data.js
            site-regions.js
            site-runtime.js
            favicon-source.png
            logo-placeholder.svg
            media-placeholder.svg
          )
          for file in "${core_files[@]}"; do
            test -f "$file"
            cp "$file" _site/
          done
          shopt -s nullglob
          for file in hero.webp profile.webp gallery-*.webp team-*.webp logo.webp logo.png logo.svg; do
            cp "$file" _site/
          done
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.TANEM_PAGES_TOKEN || github.token }}
          enablement: ${{ secrets.TANEM_PAGES_TOKEN != '' && 'true' || 'false' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: validate-and-package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
