name: Public healthcheck 7 Nebo

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check DNS and HTTP/HTTPS
        run: |
          set -u
          echo "=== DNS via system resolver ==="
          getent ahostsv4 7-nebo.tanem.ru || true
          echo "=== DNS via Google ==="
          dig +short A 7-nebo.tanem.ru @8.8.8.8 || true
          echo "=== DNS via Cloudflare ==="
          dig +short A 7-nebo.tanem.ru @1.1.1.1 || true
          echo "=== HTTP ==="
          curl -sS -L --max-time 20 -D /tmp/http.headers http://7-nebo.tanem.ru/ -o /tmp/http.html || true
          sed -n '1,20p' /tmp/http.headers 2>/dev/null || true
          grep -F '7 Небо' /tmp/http.html >/dev/null 2>&1 && echo "HTTP_CONTENT=OK" || echo "HTTP_CONTENT=NOT_CONFIRMED"
          echo "=== HTTPS ==="
          curl -sS -L --max-time 20 -D /tmp/https.headers https://7-nebo.tanem.ru/ -o /tmp/https.html || true
          sed -n '1,20p' /tmp/https.headers 2>/dev/null || true
          grep -F '7 Небо' /tmp/https.html >/dev/null 2>&1 && echo "HTTPS_CONTENT=OK" || echo "HTTPS_CONTENT=NOT_CONFIRMED"
